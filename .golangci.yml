version: "2"

run:
  timeout: 5m
  tests: false
  # Lint the tray and GTK window; their untagged stubs compile in go test
  build-tags:
    - systray
    - gtk

linters:
  enable:
    - govet
    - staticcheck
    - ineffassign
    - errcheck
    - gosec
    - unconvert
    - unused
    - unparam
    - gocyclo
    - revive
  settings:
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        # Exported identifiers need a doc comment that starts with their name
        - name: exported
          arguments:
            - disableStutteringCheck
  exclusions:
    paths:
      - build
    rules:
      # Test doubles mirror interfaces documented elsewhere
      - path: (mocks/|mock_tray\.go|testutils/)
        linters:
          - revive
