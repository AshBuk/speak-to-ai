version: "2"

run:
  timeout: 5m
  tests: false
  # Lint the tray and GTK window; their untagged stubs compile in go test
  build-tags:
    - systray
    - gtk

linters:
  enable:
    - govet
    - staticcheck
    - ineffassign
    - errcheck
    - gosec
    - unconvert
    - unused
    - unparam
    - gocyclo
  settings:
    gocyclo:
      min-complexity: 15
  exclusions:
    paths:
      - build
